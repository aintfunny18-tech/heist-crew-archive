<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080c0d" />
  <meta name="description" content="A fantasy intelligence archive for eight selectable D&D heist specialists." />
  <title>The Crew Archive · Character Selection</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./player-profiles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app-shell">
    <header class="topbar">
      <a class="brand" href="#crew" aria-label="The Crew Archive home">
        <span class="brand-mark">CA</span>
        <span class="brand-copy"><strong>The Crew</strong><span>Archive</span></span>
      </a>
      <nav class="topnav" aria-label="Primary navigation">
        <a href="#crew" data-route="crew">Crew</a>
        <a href="#dossiers" data-route="dossiers">Dossiers</a>
        <a href="#operations" data-route="operations">Operations</a>
        <a href="#whiteboard" data-route="whiteboard">Whiteboard</a>
        <a href="#archive" data-route="archive">Archive</a>
      </nav>
      <div class="crew-status" aria-label="Selection status">
        <span>Selection status</span><strong><i></i> Open</strong>
      </div>
      <button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
    </header>

    <main id="main" tabindex="-1"></main>

    <footer class="operation-bar selection-bar" aria-label="Character selection">
      <div><span>Selection phase</span><strong>Open</strong></div>
      <div><span>Candidates</span><strong>8 level-10 roles</strong></div>
      <div><span>Submit</span><strong>Top 3 + optional hard no</strong></div>
      <div><span>Starting level</span><strong>10</strong></div>
    </footer>
  </div>

  <script src="./crew-data.js"></script>
  <script src="./data/conman.js"></script>
  <script src="./data/cleaner.js"></script>
  <script src="./data/hacker.js"></script>
  <script src="./data/hitter.js"></script>
  <script src="./data/vent-guy.js"></script>
  <script src="./data/driver.js"></script>
  <script src="./data/distraction.js"></script>
  <script src="./data/pickpocket.js"></script>
  <script src="./player-profiles.js"></script>
  <script>
    const approvedCleaner = window.HEIST_CREW_DATA.crew.find(member => member.key === "cleaner");
    if (approvedCleaner) {
      approvedCleaner.portrait = "portraits/cleaner.svg";
      approvedCleaner.visual = "Black Reborn woman of subtly elven ancestry, with close braids, haunted eyes, faint deathless seams, restrained medical-monastic clothing, and a calm forensic presence.";
    }
  </script>
  <script src="./app.js"></script>
  <script src="./archive-framing.js"></script>
</body>
</html>
